name: HongguoTV
options:
  bundleIdPrefix: com.hongguotv
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    SWIFT_ENABLE_BATCH_MODE: NO
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/HongguoTV/Crypto/gmssl/include"
targets:
  HongguoTV:
    type: application
    platform: tvOS
    sources:
      - path: HongguoTV
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.hongguotv.tvos
        TVOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: HongguoTV/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: HongguoTV/Crypto/BridgingHeader.h
        ENABLE_TESTABILITY: YES
  HongguoTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: HongguoTVTests
    dependencies:
      - target: HongguoTV
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.hongguotv.tvos.tests
        TVOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_TESTABILITY: YES
schemes:
  HongguoTV:
    build:
      targets:
        HongguoTV: all
    test:
      targets:
        - HongguoTVTests
